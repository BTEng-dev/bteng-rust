# License gate. The point of this file is that THIRD-PARTY-LICENSES.md stops
# being true the moment someone adds a dependency, and nobody notices. This
# fails the build instead.
#
#   cargo deny check licenses sources bans

[graph]
# Both targets the project supports (DR-2). A dependency that is pulled in only
# on aarch64 gets its license checked too.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[licenses]
# Permissive only. Anything outside this list is a decision, not a default, and
# it should be made in a pull request rather than discovered at release time.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "Unicode-3.0",
]
confidence-threshold = 0.93
# Three of the entries above (Apache-2.0 WITH LLVM-exception, Unicode-3.0, and
# on some days Unlicense) are reached only by feat/py-control-plane. Allowing a
# license this branch does not currently use is deliberate, not stale config.
unused-allowed-license = "allow"
# First-party crates carry the workspace MIT license; no need to re-derive it.
private = { ignore = true }

[bans]
# Both are smells, not errors, in a tree this small — and every "wildcard" here
# is a `path` dependency between our own crates, which is how a workspace is
# built. Neither should fail a build; both are worth seeing in the log.
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Security advisories are deliberately not part of this gate. They fail on the
# calendar rather than on the diff, and this tree is two third-party crates
# deep. To turn them on, add `advisories` to the CI command above.
[advisories]
yanked = "warn"
